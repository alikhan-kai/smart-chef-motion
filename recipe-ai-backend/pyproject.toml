[project]
name = "smart-chef-backend"
version = "0.1.0"
description = "Smart Chef backend: builds a recipe book from free-form user requests"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "langchain-openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "llm/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header() are meant to be called in argument defaults -
# that's how the framework recognizes a dependency. B008 doesn't know this
# convention; this is ruff's documented fix. Needed starting with the chat
# endpoints (backend/api/routes_chats.py, routes_recipe_book.py), the first
# place this codebase uses FastAPI's Depends().
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
