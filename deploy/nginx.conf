upstream chef_backend {
    zone chef_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Magazine covers are uploaded through this proxy.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://chef_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ =404;
        # Demo updates should take effect on the next browser reload.
        add_header Cache-Control "no-store";
    }
}
